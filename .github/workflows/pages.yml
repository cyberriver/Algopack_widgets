name: github-pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * 1-5'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run bake
      - run: npm run manifests
        env:
          EMBED_PUBLIC_URL: https://cyberriver.github.io/Algopack_widgets
          GITHUB_PAGES: '1'
      - run: npm run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
