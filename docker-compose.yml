services:
  app:
    image: algopack-widgets:1.0.2
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "3010"
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
    volumes:
      - lab_data:/app/data/lab
    ports:
      - "${APP_PORT:-3010}:3010"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3010/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  lab-worker:
    image: algopack-widgets:1.0.2
    restart: unless-stopped
    healthcheck:
      disable: true
    command:
      - node
      - -e
      - >
        const run = async () => {
          try {
            const response = await fetch('http://app:3010/api/lab/tick', { method: 'POST' });
            if (!response.ok) console.error('lab tick', response.status);
          } catch (error) {
            console.error('lab tick', error);
          } finally {
            setTimeout(run, 30000);
          }
        };
        run();
    depends_on:
      app:
        condition: service_healthy

  caddy:
    profiles: ["https"]
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
  lab_data:
